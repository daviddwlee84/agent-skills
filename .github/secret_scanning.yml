# Exclude agent-history-hygiene's intentional secret-shape test vectors from
# GitHub-native secret scanning / push protection.
#
# These are fake, all-`a` filler strings that exist so the skill's gitleaks
# rules + redactor have a corpus to fire against — see
# skills/local/agent-history-hygiene/tests/README.md ("Test-vector hygiene").
# The fixtures also carry inline `<!-- gitleaks:allow -->` markers, but
# GitHub-native scanning honors neither those nor `.gitleaksignore`, so it needs
# its own path exclusion. Harmless if secret scanning isn't enabled on the remote.
paths-ignore:
  - "skills/local/agent-history-hygiene/tests/fixtures/**"
  - "skills/local/agent-history-hygiene/tests/test_redact_secrets.py"
