site_name: Agent Skills
site_description: Personal collection of agent skills — both custom-authored and cherry-picked from upstream repos.
site_url: https://daviddwlee84.github.io/agent-skills/
repo_url: https://github.com/daviddwlee84/agent-skills
repo_name: daviddwlee84/agent-skills
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  language: en
plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh-TW
          name: 繁體中文 (zh-TW)
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        Personal collection of agent skills — local custom-authored skills under skills/local/ and 3rd-party skills cherry-picked into skills/vendor/ via the vendor.yaml manifest. Includes project-knowledge-harness (a TODO/backlog/pitfalls memory harness with bundled init/kanban/promote scripts) and quantatitive-factor-researcher (a Python quant-research persona). Installable via `npx skills@latest add daviddwlee84/agent-skills/skills`.

      sections:
        Guides:
          - index.md
          - getting-started.md
          - conventions.md
        Workflows:
          - workflows/*.md
        Skills:
          - skills/*.md
        Reference:
          - reference/*.md
        Changelog:
          - changelog.md
  - copy-to-llm:
      repo_url: "https://daviddwlee84.github.io/agent-skills"
      button_hover_color: "var(--md-primary-fg-color)"
      toast_bg_color: "var(--md-primary-fg-color)"
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
        - docs/_snippets
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Conventions: conventions.md
  - Workflows:
      - Adding vendor skills: workflows/adding-vendor-skills.md
      - Creating local skills: workflows/creating-local-skills.md
      - Project memory: workflows/project-memory.md
  - Skills:
      - Overview: skills/index.md
      - Local:
          - project-knowledge-harness: skills/project-knowledge-harness.md
          - quantatitive-factor-researcher: skills/quantatitive-factor-researcher.md
          - skill-author: skills/skill-author.md
          - mkdocs-site-bootstrap: skills/mkdocs-site-bootstrap.md
          - marimo-batch-mlflow: skills/marimo-batch-mlflow.md
          - dvc-ml-workflow: skills/dvc-ml-workflow.md
          - mlflow-tracking: skills/mlflow-tracking.md
          - agent-history-hygiene: skills/agent-history-hygiene.md
          - pueue-job-queue: skills/pueue-job-queue.md
      - Vendored:
          - marimo-notebook: skills/marimo-notebook.md
          - streamlit-to-marimo: skills/streamlit-to-marimo.md
          - anywidget: skills/anywidget.md
          - skill-creator: skills/skill-creator.md
          - Fullstack Next.js:
              - nextjs: skills/nextjs.md
              - shadcn: skills/shadcn.md
              - supabase: skills/supabase.md
              - supabase-postgres-best-practices: skills/supabase-postgres-best-practices.md
              - react-best-practices: skills/react-best-practices.md
              - vercel-storage: skills/vercel-storage.md
              - web-design-guidelines: skills/web-design-guidelines.md
              - frontend-design: skills/frontend-design.md
              - webapp-testing: skills/webapp-testing.md
  - Reference:
      - TODO format: reference/todo-format.md
      - Tag schema: reference/tag-schema.md
      - Pitfalls format: reference/pitfalls.md
      - Bundled scripts: reference/scripts.md
      - Downstream docs stack recipe: reference/docs-stack-recipe.md
      - npx skills metadata model: reference/npx-skills-metadata.md
  - Changelog: changelog.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daviddwlee84/agent-skills
# `_snippets/` are meant to be included via pymdownx.snippets, never
# rendered as their own page. `not_in_nav` suppresses the INFO warning.
not_in_nav: |
  /_snippets/
# Validation: keep strict mode useful but don't fail on links to files
# that exist in the *built* site/ but not in docs/ source (e.g.
# llms.txt and llms-full.txt produced by mkdocs-llmstxt at build time,
# and per-page <page>/index.md raw-markdown URLs which are directory
# URLs that only exist post-build).
# Demote 'not_found' from warn -> info so --strict still passes; keep
# everything else at defaults (anchors/absolute_links stay warn-able).
validation:
  links:
    not_found: info
