[project]
name = "agent-skills"
version = "0.0.0"
description = "Personal collection of agent skills (custom + vendored). The Python project here exists only to manage the docs site build."
requires-python = ">=3.11"
# No runtime dependencies. The repo itself is shell + markdown; this
# pyproject.toml exists so that `uv sync --extra docs` can manage the
# MkDocs Material toolchain that builds the documentation site.
dependencies = []

[project.optional-dependencies]
docs = [
  # Cap mkdocs/mkdocs-material below the next major: MkDocs 2.0 removes the
  # plugin system entirely (no llmstxt / static-i18n / copy-to-llm under 2.x)
  # and Material for MkDocs is shipping a separate replacement (Zensical)
  # rather than upgrading. Stay on 1.x until Zensical or another successor
  # lands a stable release with i18n + llmstxt support.
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocs-llmstxt>=0.1",
  "mkdocs-copy-to-llm>=0.1",
  "mkdocs-static-i18n>=1.2",
  # pymdownx is bundled with mkdocs-material, but pin explicitly so the
  # snippets / superfences / tabbed extensions never silently disappear.
  "pymdown-extensions>=10.0",
]
dev = [
  # Test runner for agent-history-hygiene's pytest suite. See
  # skills/local/agent-history-hygiene/tests/ and `make test-skill`.
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
# Nothing in this repo may rewrite files it does not own.
#   skills/vendor/  -- upstream bytes; sync-vendor.sh `rm -rf`s and re-downloads
#                      the dir, so any reformat is reverted on the next
#                      `make sync` and shows up as noise in the vendor-sync PR.
#   .agents/ .claude/ -- skills installed by `npx skills`, hashed in
#                      skills-lock.json; reformatting invalidates computedHash.
#   the rest        -- agent artifacts are records, not source. Since ruff 0.16
#                      `ruff format` also formats Python inside Markdown code
#                      blocks, so it rewrites committed transcripts.
# See pitfalls/formatter-rewrites-committed-agent-transcripts.md
extend-exclude = [
    ".agents",
    ".claude",
    ".codex",
    ".cursor",
    ".opencode",
    ".specify",
    ".specstory",
    "skills/vendor",
]
# Load-bearing. Ruff ignores exclude/extend-exclude for paths passed explicitly
# on the command line -- which is exactly how the ruff pre-commit hook invokes
# it. Without this, the excludes above protect `ruff format .` and silently do
# nothing under pre-commit.
force-exclude = true
